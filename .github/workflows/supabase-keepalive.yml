name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 07:00 UTC — comfortably under Supabase's 7-day
    # free-tier inactivity pause threshold.
    - cron: "0 7 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to register activity
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/user_profile?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $status"
          cat /tmp/response.json

          if [ "$status" -ge 300 ]; then
            echo "Supabase ping failed with status $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
